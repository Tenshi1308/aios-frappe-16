<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIOS Admin</title>
  {% if admin_css %}<link rel="stylesheet" href="{{ admin_css }}">{% endif %}
</head>
<body>
  {% if admin_error %}
  <div class="aios-admin-error">{{ admin_error }}</div>
  {% elif not admin_js %}
  <div class="aios-admin-error">Dashboard belum di-build. Jalankan build admin/ terlebih dahulu.</div>
  {% else %}
  <div id="app"></div>
  <script type="module" src="{{ admin_js }}"></script>
  {% endif %}
</body>
</html>
